name: CI/CD Mobile Engineering (Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache de dependências Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: \${{ runner.os }}-gradle-\${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: \${{ runner.os }}-gradle-
      - name: Conceder permissão de execução ao Gradle
        run: chmod +x gradlew
      - name: Executar Lint (Análise Estática)
        run: ./gradlew lintDebug
      - name: Executar Testes Unitários
        run: ./gradlew testDebugUnitTest
      - name: Gerar Relatório de Cobertura (JaCoCo)
        run: ./gradlew jacocoTestReport
      - name: Upload do Relatório de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
