name: CI/CD Mobile Engineering (Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache de dependências Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ✅ PROJETO NA RAIZ (Recomendado para Certificação)
      - name: Conceder permissão de execução ao Gradle
        run: chmod +x gradlew
        # working-directory: ./build-temp  # <--- Use SE o projeto estiver nesta pasta

      - name: Executar Lint (Análise Estática)
        run: ./gradlew lintDebug
        # working-directory: ./build-temp  # <--- Comente se projeto estiver na raiz

      - name: Executar Testes Unitários
        run: ./gradlew testDebugUnitTest
        # working-directory: ./build-temp  # <--- Comente se projeto estiver na raiz

      - name: Gerar Relatório de Cobertura (JaCoCo)
        run: ./gradlew jacocoTestReport
        # working-directory: ./build-temp  # <--- Comente se projeto estiver na raiz

      - name: Upload do Relatório de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html/