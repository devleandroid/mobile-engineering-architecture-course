name: CI/CD Mobile Engineering (iOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Selecionar versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app
      - name: Limpar Derived Data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData
      - name: Restaurar dependências Swift (SPM)
        run: swift package resolve
      - name: Executar Testes Unitários e de UI
        run: |
          xcodebuild test \
            -project SeuProjeto.xcodeproj \
            -scheme SeuScheme \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            -enableCodeCoverage YES
      - name: Gerar Relatório de Cobertura (slather)
        run: |
          gem install slather
          slather coverage --simple-output --scheme SeuScheme SeuProjeto.xcodeproj
